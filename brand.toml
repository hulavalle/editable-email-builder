# The brand of your emails. Every color and font a template uses comes from here: the lint
# (rules B1 and B2) rejects anything else. Fork the repo and replace these values with yours.

width = 600
# Below this screen width the email switches to one column. Not 600: a max-width:600px media
# query also fires on a 600 px screen.
mobile = 599

[colors]
primary = "#1d4e5f"
ink = "#13293d"
sand = "#f7f3ec"
mist = "#f5f5f5"
white = "#ffffff"
black = "#000000"

[fonts]
# Gmail and Outlook do not load web fonts: they show the end of each stack.
headings = "'Playfair Display', Georgia, 'Times New Roman', serif"
body = "'Open Sans', Arial, Helvetica, sans-serif"
google = "https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"

# Shipping update: the order is on its way, where it is in the journey and what is inside.

example = true
lang = "en"

[[block]]
type = "logo_header"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "hero_text"
text = """
<h1>Your order is on its way</h1>
<p>Order #10482 left our warehouse today.</p>
"""
button = '<a href="https://www.example.com/track" target="_blank">TRACK PACKAGE</a>'

[[block]]
type = "steps"

[[block.items]]
text = """
<h3>Ordered</h3>
<p>Monday, 4 March</p>
"""

[[block.items]]
text = """
<h3>Shipped</h3>
<p>Tuesday, 5 March</p>
"""

[[block.items]]
text = """
<h3>Arriving</h3>
<p>Thursday, 7 March</p>
"""

[[block]]
type = "section_title"
text = "<h2>In this package</h2>"

[[block]]
type = "order_summary"

[[block.items]]
photo = "library:product-one.jpg"
photo_alt = "Linen throw"
name = """
<h3>Linen throw</h3>
<p>Sand · Quantity 1</p>
"""
price = "<p>$89.00</p>"

[[block.totals]]
label = "<p><strong>Total</strong></p>"

# Product benefits: the logo and a large title, a product photo, three benefits each with a short
# explanation between thin rules, a full-width button, a materials title with a photo and a
# paragraph, a two-column "free from" list, a second button, then the logo, social icons, a boxed
# disclaimer and the legal lines.
# Kit frame 1:6372. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "logo_header"
id = "top"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "heading_text"
id = "title"
padding = "24px 40px 40px"
text = "<h1>Comfort you can actually feel*</h1>"

[[block]]
type = "image"
id = "hero"
photo = "library:product-wide.jpg"
photo_alt = "A linen throw folded on an oak bench"

[[block]]
type = "faq"
text = """
<h3>Sleep cooler, all year</h3>
<p>Washed linen breathes in summer and holds warmth in winter, so the bed stays comfortable without a second blanket.</p>
<h3>Softer with every wash</h3>
<p>The flax fibers relax a little each time, so the throw you buy today feels better in a year than on the first night.</p>
<h3>Made to last</h3>
<p>Double-stitched hems and a tight weave mean it keeps its shape for years of daily use, washing and folding.</p>
"""

[[block]]
type = "button"
id = "one"
width = "540"

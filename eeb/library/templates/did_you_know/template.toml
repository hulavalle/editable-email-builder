type = "logo_header"
id = "top"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "image"
id = "hero"
photo = "library:hero-photo.jpg"
photo_alt = "Linen bedding in morning light"

[[block]]
type = "spacer"
id = "hero"
band = "accent"
height = "6"

[[block]]
type = "heading_text"
id = "fact"
band = "mist"
text = """
<h2><strong>Linen keeps you<br>cool at night</strong></h2>
<p>Did you know that flax fibers are hollow? They pull damp air away from your skin and let it go, so a linen sheet feels cool on a warm night and warm on a cold one.</p>
"""

[[block]]
type = "heading_text"
id = "how"
padding = "44px 40px 8px"
text = "<h2><strong>Here's how</strong></h2>"

[[block]]
type = "steps"

[[block.items]]
text = "<p>Hollow fibers hold a thin layer of air, which evens out your temperature through the night.</p>"

[[block.items]]
text = "<p>Linen takes up to a fifth of its weight in moisture before it feels damp to the touch.</p>"

[[block.items]]
text = "<p>The loose weave lets air move through the sheet, so heat never builds up under the covers.</p>"

[[block.items]]
text = "<p>Every wash softens the fibers, so your sheets feel better in their second year than in their first.</p>"

[[block]]
type = "heading_text"
id = "closing"
padding = "8px 40px 24px"
text = "<p>That is why we weave our bedding from flax grown and spun in Europe, and wash it twice before it ships. It arrives soft and only gets softer.</p>"

[[block]]
type = "button"
id = "how"
button = '<a href="https://www.example.com/bedding" target="_blank">SHOP LINEN BEDDING &rarr;</a>'


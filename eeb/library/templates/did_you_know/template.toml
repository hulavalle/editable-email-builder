# Did you know: a surprising fact about a product, told in steps. The logo over a photo with an
# accent rule, the fact on a soft band, four numbered "here's how" points with a button, a product
# photo with a second pitch and button, a closing photo, then a dark footer with the logo, a
# tagline, stacked link buttons and the legal lines.
# Kit frame 1:4567. See docs/catalog.md for what changed from the design.

example = true
lang = "en"


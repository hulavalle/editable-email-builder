# Customer questions: a promo strip, a header with logo, title and button above a photo, three
# questions each answered and followed by a recommended product with a button, a pro tip card, a
# sign-off on a dark band, six features, a label strip, social icons and the legal lines.
# Kit frame 1:3922. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "promo"
id = "top"
band = "mist"
text = "<p>Free shipping on orders over $80</p>"

[[block]]
type = "hero_image"

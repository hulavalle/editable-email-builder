# Low stock alert: one photo header with the logo, a two-weight "last chance" title, a few lines on
# the last units and a shop button, then a dark footer with the logo, stacked pill links, social
# icons and the legal lines.
# Kit frame 1:525. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "hero_background"
background = "library-url:hero-dark.jpg"
logo = "library:logo.png"
logo_alt = "Example Co."
gap = "220"
title = """
<h1><em>Last chance</em><br>for the oat throw</h1>
<p>This is your last chance to bring one home before it is gone again.</p>
<p>We are down to the final units, and once they sell out, this color will not be back for a while.</p>
"""
button = '<a href="https://www.example.com/p/throw" target="_blank">SHOP NOW</a>'
spacer = "60"

[[block]]
type = "logo_header"
band = "black"
logo = "library:logo.png"
logo_alt = "Example Co."

[[block]]
type = "link_stack"
band = "black"
style = "pills"
links = """
<p><a href="https://www.example.com/shop" target="_blank">All products</a></p>
<p><a href="https://www.example.com/sustainability" target="_blank">Sustainability</a></p>
<p><a href="https://www.example.com/faq" target="_blank">FAQ</a></p>
"""

[[block]]
type = "social"
band = "black"

[[block.networks]]
url = "https://www.example.com/social/one"
icon = "library:social-one-light.png"
name = "Instagram"

[[block.networks]]
url = "https://www.example.com/social/two"
icon = "library:social-two-light.png"
name = "Facebook"

[[block.networks]]
url = "https://www.example.com/social/three"
icon = "library:social-three-light.png"
name = "X"

[[block.networks]]
url = "https://www.example.com/social/four"
icon = "library:social-four-light.png"
name = "YouTube"

[[block]]
type = "footer"
band = "black"
text = """
<p>You received this email from {{esp.company}}. {{esp.address}}</p>
<p>If you would rather not hear from us, <a href="{{esp.unsubscribe_url}}" target="_blank">unsubscribe here</a>.</p>
"""

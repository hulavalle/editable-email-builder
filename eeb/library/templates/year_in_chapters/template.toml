# Year in review told in chapters, on a soft band: a photo header, a short intro, numbered chapters
# (new pieces and best sellers as alternating photo-and-quote rows, then the team, a new workshop, a
# collaboration, big wins and press mentions as photo cards and lists), a closing note with a
# button, a follow-along title with social icons, links and the legal lines.
# Kit frame 1:2384. See docs/catalog.md for what changed from the design.

example = true
lang = "en"


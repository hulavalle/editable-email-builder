# Contest invitation, on black: the logo beside the partner's name, a photo, an eyebrow and title
# with an enter button, the rules in a few lines, the two prizes as photo cards, a photo with a
# second headline, text and a guide button, a rule, a shop-the-workshop photo mosaic with a button
# under each photo, then the logo, social icons and the legal lines with the fine print.
# Kit frame 1:4865. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "logo_bar"
band = "black"
logo = "library:logo.png"
logo_alt = "Example Co."
text = "<p>WITH FIELD KITCHEN</p>"

[[block]]
type = "image"
id = "top"
photo = "library:hero-photo.jpg"
photo_alt = "A long table set outdoors"

[[block]]
type = "hero_text"
band = "black"
text = """
<p>YOUR CHANCE TO WIN</p>
<h1>The open-fire kitchen giveaway</h1>
"""
button = '<a href="https://www.example.com/giveaway" target="_blank">ENTER TO WIN</a>'

[[block]]
type = "heading_text"
id = "rules"
band = "black"
padding = "0 50px 24px"
text = """
<p>We teamed up with Field Kitchen to give one reader everything for cooking outdoors: a cast iron set, our linen apron and a walnut serving board. Enter by Sunday, and we will draw the winner on Monday.</p>
<p><strong>THE PRIZE INCLUDES:</strong></p>
"""

[[block]]
type = "image_pair"
band = "black"

[[block.images]]
photo = "library:story-one.jpg"
photo_alt = "A cast iron pan on the fire"
caption = "<p>A cast iron set for the fire</p>"

[[block.images]]
photo = "library:story-two.jpg"
photo_alt = "A linen apron and a walnut board"
caption = "<p>Our linen apron and walnut board</p>"

[[block]]
type = "image"
id = "fade"
band = "black"
space = "24"
photo = "library:event-photo.jpg"
photo_alt = "Embers under a grill at dusk"

[[block]]
type = "heading_text"
id = "guide"
band = "black"
padding = "8px 50px 16px"
text = """
<h2>Cook better over fire</h2>
<p>From lighting the coals to resting the meat, our guide with Field Kitchen covers every step of an evening meal outdoors, and the few tools that make it easier.</p>
"""

[[block]]
type = "button"
band = "black"
button = '<a href="https://www.example.com/journal/fire" target="_blank">READ THE GUIDE</a>'

[[block]]
type = "divider"

# A founder's brand story: the logo and a photo on a soft band, the story title on a dark band, a
# wave into a personal letter, four brand values, the founder's sign-off with a button and a P.S.
# code, four best-sellers, a strip of claims, four values on a soft band, then the logo, social
# icons and the legal lines.
# Kit frame 1:6018. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "logo_header"
id = "top"
band = "sand"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "image"
id = "top"
band = "sand"
width = "320"
photo = "library:product-one.jpg"
photo_alt = "Our first linen throw, on the workshop table"

[[block]]
type = "heading_text"
id = "title"
band = "ink"
padding = "28px 30px 24px"
text = "<h1>HOW EXAMPLE CO. CAME TO BE</h1>"

[[block]]
type = "wave"
image = "library:wave-ink-white.png"

[[block]]
type = "heading_text"
id = "letter"
align = "left"
padding = "24px 50px 16px"
text = """
<p>Hey there!</p>
<p>It started with one loom in a garage and a stack of linen nobody wanted to waste. Ten years later we still weave, throw and carve by hand, in small batches, for homes that want fewer and better things.</p>
"""

[[block]]
type = "features"
id = "values_one"

[[block.items]]
icon = "library:icon-heart.png"
text = """
<h3>1% TO THE COMMUNITY</h3>
<p>A share of every order funds local craft schools.</p>
"""

[[block.items]]
icon = "library:icon-shield.png"
text = """
<h3>NO HARSH DYES</h3>
<p>Plant dyes and clean glazes, safe for every home.</p>
"""

[[block]]
type = "features"
id = "values_two"

[[block.items]]
icon = "library:icon-leaf.png"
text = """
<h3>SUSTAINABLY SOURCED</h3>
<p>Flax, clay and oak from growers we know by name.</p>
"""

[[block.items]]
icon = "library:icon-gift.png"
text = """
<h3>MADE BY HAND</h3>
<p>Every piece is finished in our own workshop.</p>
"""

[[block]]
type = "heading_text"
id = "signoff"
align = "left"
padding = "16px 50px 16px"
text = """
<p>Stay cozy, stay curious.</p>
<p>Anna<br>Founder, Example Co.</p>
"""

[[block]]
type = "button"
button = '<a href="https://www.example.com/about" target="_blank">LEARN MORE</a>'

[[block]]

# Seasonal editorial digest: a rewards strip, a photo header with the logo, a flush-left title and a
# read button, an intro line, five stories that alternate the photo side with a shop link, a row
# of three products, a shop button, two photo tiles, a heading over stacked links, a gift guide
# band, social icons and a light legal footer.
# Kit frame 1:5104. See docs/catalog.md for what changed from the design.

example = true
lang = "en"


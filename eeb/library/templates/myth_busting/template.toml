[[block.networks]]
url = "https://www.example.com/social/two"
icon = "library:social-two-light.png"
name = "Facebook"

[[block.networks]]
url = "https://www.example.com/social/three"
icon = "library:social-three-light.png"
name = "X"

[[block]]
type = "footer"
band = "black"
text = """
<p>Your future self says thank you.</p>
<p>No longer want these emails? <a href="{{esp.unsubscribe_url}}" target="_blank">Unsubscribe</a>.</p>
<p>{{esp.address}}</p>
"""

<p>KITCHEN</p>
<h3>Why do wooden spoons last longer than plastic ones?</h3>
<p>Hard maple closes its grain when it dries, so it keeps no smell and takes no stain. Oil it twice a year and it will outlive the kitchen.</p>
"""

# A holiday digest: a rewards strip, a photo header titled as the digest with a read button, a short
# intro, five stories that alternate photo and text with a shop link, a row of three product links,
# a shop-all button, two photo tiles, stacked store links ending on a gift-guide band, social icons
# and the legal footer.
# Kit frame 1:1532. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "promo"
band = "mist"
text = '<p><strong>REWARDS:</strong> 10% back on every order. <a href="https://www.example.com/rewards" target="_blank">Learn more</a></p>'

[[block]]
type = "hero_background"
background = "library-url:hero-dark.jpg"
align = "left"
logo = "library:logo.png"
logo_alt = "Example Co."
title = "<h1>Your<br>Example Co.<br>holiday digest</h1>"
button = '<a href="https://www.example.com/journal/holiday" target="_blank">READ NOW</a>'
spacer = "330"

[[block]]
type = "heading_text"
id = "intro"
band = "sand"
text = "<p>Five stories from the workshop for the slow weeks at the end of the year, with the pieces that go with them.</p>"


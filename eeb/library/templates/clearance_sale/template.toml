# Clears the last of the season's stock: a teaser line, the logo beside a free-shipping promise, an
# extra-off clearance banner with an access button, four rows that pair a styled photo with a
# discounted product, three category tiles, stacked category links, the terms, social icons, and
# the legal lines with the logo.
# Kit frame 1:3264. See docs/catalog.md for what changed from the design.

example = true
lang = "en"


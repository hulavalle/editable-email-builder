# A what's-new email: the logo, a rounded photo, a short intro and a button on a soft band, a
# checkerboard of labeled photos, a framed feature photo with a link, a code strip, a grid of six
# trending products, members' perks, a pay-later strip, social icons and the legal lines.
# Kit frame 1:5419. See docs/catalog.md for what changed from the design.


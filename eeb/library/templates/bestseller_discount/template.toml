# A discount on bestsellers: the logo, a type-only header with eyebrow, title, condition and code
# button on a soft band, a full-width photo, a two-by-three grid of bestsellers, three category
# tiles, a row of service promises, and a soft footer with logo, slogan, links and social icons.
# Kit frame 1:376. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "logo_header"
id = "top"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "hero_text"
band = "sand"
text = """
<p>WE LOVE WHAT YOU PICKED</p>
<h1>Take $15 off our bestsellers</h1>
<p>On your first order over $150</p>
"""
button = '<a href="https://www.example.com/bestsellers" target="_blank">GET $15 OFF</a>'


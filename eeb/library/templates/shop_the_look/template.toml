id = "look"
width = "540"
radius = "16"
photo = "library:product-wide.jpg"
photo_alt = "A bedroom set with linen, clay and wool"

[[block]]
type = "products_two"
id = "one"
band = "white"

[[block.cards]]
photo = "library:story-one.jpg"
photo_alt = "A linen duvet cover"
name = "<h3>1. Linen duvet cover</h3><p>$180</p>"
button = '<a href="https://www.example.com/p/duvet" target="_blank">SHOP NOW</a>'

[[block.cards]]
photo = "library:story-two.jpg"
photo_alt = "A clay table lamp"
name = "<h3>2. Clay table lamp</h3><p>$120</p>"
button = '<a href="https://www.example.com/p/lamp" target="_blank">SHOP NOW</a>'

[[block]]
type = "products_two"
id = "two"
band = "white"

[[block.cards]]
photo = "library:product-four.jpg"
photo_alt = "A wool throw"
name = "<h3>3. Wool throw</h3><p>$95</p>"

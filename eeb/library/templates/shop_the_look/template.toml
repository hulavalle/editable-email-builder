# A product launch you can shop from one photo: the logo, a menu and a shipping strip, a big
# flush-left title and button over a photo, a "get the look" intro, a styled photo with its four
# numbered products and their buttons, more picks, links and the legal lines.
# Kit frame 1:5580. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "logo_header"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "menu"
band = "white"
links = '<p><a href="https://www.example.com/bestsellers" target="_blank">BESTSELLERS</a> &nbsp;&nbsp; <a href="https://www.example.com/new" target="_blank">NEW IN</a> &nbsp;&nbsp; <a href="https://www.example.com/sets" target="_blank">SETS</a> &nbsp;&nbsp; <a href="https://www.example.com/shop" target="_blank">SHOP ALL</a></p>'

[[block]]
type = "promo"
band = "line"
text = "<p>FREE SHIPPING ON ORDERS OVER $75</p>"

[[block]]
type = "hero_background"
background = "library-url:hero-dark.jpg"
align = "left"
title = "<h1>New linen<br>&amp; clay</h1>"
button = '<a href="https://www.example.com/new" target="_blank">SHOP NOW</a>'
spacer = "340"

[[block]]
type = "heading_text"
id = "look"
align = "left"
padding = "44px 50px 20px"
text = """
<h2>Get the look</h2>
<p>A washed linen bed, a clay lamp and a wool throw: four pieces that make a slow Sunday.</p>
"""

[[block]]

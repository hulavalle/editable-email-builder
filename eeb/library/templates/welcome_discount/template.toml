# A welcome email with a first-order discount: a discount strip, the logo beside the categories, a
# big photo, a welcome title over a short rule with the discount line and a button, a short intro,
# a second photo with a titled link, four product picks, then an account bar, category links with
# social icons and the legal lines.
# Kit frame 1:5666. See docs/catalog.md for what changed from the design.

example = true
lang = "en"

[[block]]
type = "promo"
band = "mist"
align = "left"
text = "<p>Enjoy 10% off your next order</p>"

[[block]]
type = "logo_bar"
id = "header"
logo = "library:logo-dark.png"
logo_alt = "Example Co."
text = '<p><a href="https://www.example.com/kitchen" target="_blank">KITCHEN</a> &nbsp; <a href="https://www.example.com/bedroom" target="_blank">BEDROOM</a> &nbsp; <a href="https://www.example.com/bath" target="_blank">BATH</a></p>'

[[block]]
type = "image"
id = "hero"
photo = "library:hero-dark.jpg"
photo_alt = "Hills at dusk"

[[block]]
type = "section_title"
text = "<h2>Welcome to Example Co.</h2>"

[[block]]
type = "heading_text"
id = "offer"
padding = "0 40px 8px"
text = "<p>Enjoy 10% off your next order, as a thank-you from us.</p>"

[[block]]
type = "button"
id = "offer"
width = "200"
style = "light"
button = '<a href="https://www.example.com/shop" target="_blank">Shop now</a>'

[[block]]
type = "heading_text"
id = "intro"
padding = "28px 50px 24px"
text = "<p>We make linen, stoneware and wooden things for the home, in small batches, in our own workshop. Everything is made to be used every day and to last for years. Here are a few places to start.</p>"

[[block]]
type = "image"
id = "staples"
width = "540"
space = "16"
photo = "library:product-wide.jpg"
photo_alt = "A table set with linen and stoneware"

[[block]]
type = "heading_text"
id = "staples"
padding = "28px 60px 24px"
text = """
<h2>Everyday staples</h2>
<p>Washed linen napkins, stoneware plates and oak boards, made for daily use.</p>
<p><strong><a href="https://www.example.com/staples" target="_blank">Shop now</a></strong></p>
"""

[[block]]
type = "heading_text"
id = "picks"
padding = "24px 40px 0"

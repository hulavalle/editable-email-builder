# Year in review or milestone: the numbers of the year, two moments in pictures and a thank-you signed by
# the founder.

example = true
lang = "en"

[[block]]
type = "logo_header"
logo = "library:logo-dark.png"
logo_alt = "Example Co."

[[block]]
type = "hero_text"
text = """
<h1>Our year, together</h1>
<p>Thank you for a year of orders, stories and kind words.</p>
"""
button = '<a href="https://www.example.com/year" target="_blank">SEE THE HIGHLIGHTS</a>'

[[block]]
type = "stats"

[[block.items]]
text = """
<h2>12k</h2>
<p>orders shipped</p>
"""

[[block.items]]
text = """
<h2>48</h2>
<p>new pieces</p>
"""

[[block.items]]
text = """
<h2>4.9</h2>
<p>average rating</p>
"""

[[block]]
type = "wave"
image = "library:wave-ink-white.png"

[[block]]
type = "image_pair"

[[block.images]]
photo = "library:story-one.jpg"
photo_alt = "The new studio"
caption = "<p>We opened the new studio</p>"

[[block.images]]
photo = "library:story-two.jpg"
photo_alt = "The summer evening"
caption = "<p>Our first summer evening</p>"

[[block]]
type = "heading_text"
text = """
<h2>See you next year</h2>
<p>We are already working on what comes next, and you will be the first to know.</p>
"""

[[block]]
type = "signature"
photo = "library:portrait.jpg"
photo_alt = "Portrait of the founder"
text = """
<p>With thanks,</p>
<h3>Marta, founder</h3>
"""

[[block]]
type = "social"

[[block.networks]]
url = "https://www.example.com/social/one"
icon = "library:social-one.png"
name = "Instagram"

[[block.networks]]
url = "https://www.example.com/social/two"
icon = "library:social-two.png"
name = "Facebook"

[[block.networks]]
url = "https://www.example.com/social/three"
icon = "library:social-three.png"
name = "X"

[[block.networks]]
url = "https://www.example.com/social/four"
icon = "library:social-four.png"
name = "YouTube"

[[block]]
type = "footer"
text = """
<p>{{esp.permission_reminder}}</p>
<p>Copyright © {{esp.year}} {{esp.company}}. All rights reserved.</p>
<p>{{esp.address}}</p>
<p><a href="{{esp.archive_url}}" target="_blank">View in browser</a> · <a href="{{esp.preferences_url}}" target="_blank">Update preferences</a> · <a href="{{esp.unsubscribe_url}}" target="_blank">Unsubscribe</a></p>
"""

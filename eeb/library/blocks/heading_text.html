<!-- A heading and one or two paragraphs. The everyday body block. `align` sets the text left or
     centered, and `padding` changes the space around it, such as "8px 40px 24px" under a photo.
     Use an `id` to place it more than once. -->
<style>
/* @group Text / Heading */
.copy-text h2 {
  /* @editable */ color:{{brand.colors.primary}};
  /* @editable */ font-size:30px;
  font-family:{{brand.fonts.headings}};
  font-weight:400;
  line-height:38px;
  padding:0 0 16px;
}

/* @group Text / Paragraph */
.copy-text p {
  /* @editable */ color:{{brand.colors.ink}};
  /* @editable */ font-size:17px;
  font-family:{{brand.fonts.body}};
  line-height:27px;
  padding:0 0 12px;
}

/* @group Text / Links */
.copy-text a {
  /* @editable */ color:{{brand.colors.primary}};
  text-decoration:underline;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .copy-text h2 { font-size:25px !important; line-height:32px !important; }
}
</style>
<tr>
<td class="copy band-{{band|white}} mobile-pad" data-edit="text" data-label="Text" align="{{align|center}}" style="padding:{{padding|44px 40px 32px}};">
<div class="copy-text">
{{text}}
</div>
</td>
</tr>

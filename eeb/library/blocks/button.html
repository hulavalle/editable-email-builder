<!-- One centered button and nothing else. Use an `id` to place it more than once. Hideable. -->
<style>
/* @group Button / Background */
.button-row {
  /* @editable */ background-color:{{brand.colors.white}};
}
</style>
<tr>
<td class="button-row" align="center" style="padding:8px 30px 36px;">
<table role="presentation" class="button-table" data-hide width="320" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; width:320px;">
<tr>
<td class="button-primary" data-edit="button" data-label="Button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>

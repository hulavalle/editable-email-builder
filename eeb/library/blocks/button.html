<!-- One button and nothing else. `style` picks a button of base.html: primary, light or accent.
     `width` and `align` size and place it. Use an `id` to place it more than once. Hideable. -->
<tr>
<td class="button-row band-{{band|white}}" align="{{align|center}}" style="padding:8px 30px 36px;">
<table role="presentation" class="button-table" data-hide width="{{width|320}}" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; width:{{width|320}}px;">
<tr>
<td class="button-{{style|primary}}" data-edit="button" data-label="Button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>

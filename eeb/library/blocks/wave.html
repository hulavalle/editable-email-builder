<!-- A full-width image that joins two sections of different colors, such as a wave. The image is
     painted with brand colors, so the sections around it keep those colors. Use an `id` to place
     it more than once. -->
<tr>
<td style="font-size:0; line-height:0;">
<img class="fluid" src="{{image}}" width="600" alt="" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
</td>
</tr>

<!-- A customer quote with a small portrait and the person's name. Use an `id` to place it more
     than once. -->
<style>
/* @group Testimonial / Background */
.testimonial {
  /* @editable */ background-color:{{brand.colors.sand}};
}

/* @group Testimonial / Quote */
.testimonial-text h3 {
  /* @editable */ color:{{brand.colors.ink}};
  /* @editable */ font-size:22px;
  font-family:{{brand.fonts.headings}};
  font-style:italic;
  font-weight:400;
  line-height:32px;
  padding:0 0 14px;
  text-align:center;
}

/* @group Testimonial / Name */
.testimonial-text p {
  /* @editable */ color:{{brand.colors.primary}};
  font-family:{{brand.fonts.body}};
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  line-height:20px;
  text-align:center;
  text-transform:uppercase;
}
</style>
<tr>
<td class="testimonial mobile-pad" align="center" style="padding:40px 50px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="padding:0 0 18px; font-size:0; line-height:0;">
<img data-edit="testimonial_photo" data-label="Testimonial: portrait" src="{{photo}}" width="72" alt="{{photo_alt}}" style="display:block; width:72px; max-width:72px; height:auto; border:0; border-radius:36px;">
</td>
</tr>
<tr>
<td class="testimonial-text" data-edit="testimonial" data-label="Testimonial: quote and name" align="center">
{{text}}
</td>
</tr>
</table>
</td>
</tr>

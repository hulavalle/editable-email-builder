<!-- A header made of type: eyebrow, big title, short text and a button on the brand color. For
     emails without a strong photo. The button is optional. -->
<style>
/* @group Text header / Title */
.hero-text-copy h1 {
  /* @editable */ color:{{brand.colors.white}};
  /* @editable */ font-size:44px;
  font-family:{{brand.fonts.headings}};
  font-weight:700;
  line-height:52px;
  padding:0 0 16px;
  text-align:center;
}

/* @group Text header / Text */
.hero-text-copy p {
  /* @editable */ color:{{brand.colors.white}};
  /* @editable */ font-size:18px;
  font-family:{{brand.fonts.body}};
  line-height:28px;
  text-align:center;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .hero-text-copy h1 { font-size:34px !important; line-height:42px !important; }
}
</style>
<tr>
<td class="hero-text band-{{band|primary}} mobile-pad" align="center" style="padding:56px 30px 52px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td class="hero-text-copy" data-edit="hero_text" data-label="Text header: copy" align="center" style="padding:0 0 28px;">
{{text}}
</td>
</tr>
{{#button?}}
<tr>
<td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;">
<tr>
<td class="button-accent" data-edit="hero_text_button" data-label="Text header: button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>
{{/button}}
</table>
</td>
</tr>

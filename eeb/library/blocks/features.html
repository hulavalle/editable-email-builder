<!-- Short reasons side by side, one column per item: two to five columns, three by default. Each
     has an optional icon, a title and a line of text. For benefits, guarantees, shipping promises
     and signatures. `rules = true` draws thin lines between the columns. Stacks on a phone. -->
<style>
/* @group Features / Title */
.feature-text h3 {
  /* @editable */ color:{{brand.colors.primary}};
  font-family:{{brand.fonts.headings}};
  font-size:19px;
  font-weight:400;
  line-height:25px;
  padding:0 0 6px;
  text-align:center;
}

/* @group Features / Text */
.feature-text p {
  /* @editable */ color:{{brand.colors.ink}};
  font-family:{{brand.fonts.body}};
  font-size:14px;
  line-height:21px;
  text-align:center;
}

/* @group Features / Rules */
.features-ruled .feature-column {
  border-left:1px solid {{brand.colors.line}};
}
.features-ruled .feature-column-1 {
  border-left:0;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .feature-column { display:block !important; width:100% !important; padding:0 0 28px !important; }
  .features-ruled .feature-column { border-left:0 !important; }
}
</style>
<tr>
<td class="features{{#rules?}} features-ruled{{/rules}} band-{{band|white}}" style="padding:32px 20px 24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
{{#items}}
<td class="feature-column feature-column-{{n}}" width="{{share:558}}" valign="top" style="width:{{share:558}}px; padding:0 7px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{{#icon?}}
<tr>
<td align="center" style="padding:0 0 12px; font-size:0; line-height:0;">
<img data-edit="feature_{{n}}_icon" data-label="Feature {{n}}: icon" src="{{icon}}" width="48" alt="" style="display:block; width:48px; max-width:48px; height:auto; border:0;">
</td>
</tr>
{{/icon}}
<tr>
<td class="feature-text" data-edit="feature_{{n}}_text" data-label="Feature {{n}}: text" align="center">
{{text}}
</td>
</tr>
</table>
</td>
{{/items}}
</tr>
</table>
</td>
</tr>

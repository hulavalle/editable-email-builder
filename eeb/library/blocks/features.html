<!-- Three short reasons in three columns, each with an icon, a title and a line of text. For
     benefits, guarantees and shipping promises. Stacks on a phone. -->
<style>
/* @group Features / Background */
.features {
  /* @editable */ background-color:{{brand.colors.white}};
}

/* @group Features / Title */
.feature-text h3 {
  /* @editable */ color:{{brand.colors.primary}};
  font-family:{{brand.fonts.headings}};
  font-size:19px;
  font-weight:400;
  line-height:25px;
  padding:0 0 6px;
  text-align:center;
}

/* @group Features / Text */
.feature-text p {
  /* @editable */ color:{{brand.colors.ink}};
  font-family:{{brand.fonts.body}};
  font-size:14px;
  line-height:21px;
  text-align:center;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .feature-column { display:block !important; width:100% !important; padding:0 0 28px !important; }
}
</style>
<tr>
<td class="features" style="padding:32px 20px 24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
{{#items}}
<td class="feature-column" width="186" valign="top" style="width:186px; padding:0 7px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="padding:0 0 12px; font-size:0; line-height:0;">
<img data-edit="feature_{{n}}_icon" data-label="Feature {{n}}: icon" src="{{icon}}" width="48" alt="" style="display:block; width:48px; max-width:48px; height:auto; border:0;">
</td>
</tr>
<tr>
<td class="feature-text" data-edit="feature_{{n}}_text" data-label="Feature {{n}}: text" align="center">
{{text}}
</td>
</tr>
</table>
</td>
{{/items}}
</tr>
</table>
</td>
</tr>

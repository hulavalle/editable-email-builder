<!-- One full-width photo. The person editing the campaign swaps it and sets its link in the
     editor. Use an `id` to place it more than once. -->
<tr>
<td style="font-size:0; line-height:0;">
<img data-edit="image" data-label="Image" class="fluid" src="{{photo}}" width="600" alt="{{photo_alt}}" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
</td>
</tr>

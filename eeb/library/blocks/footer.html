<!-- Legal footer, with an optional logo above it. Rule L1 checks that the unsubscribe link and the
     postal address are there. -->
<style>
/* @group Footer / Text */
.footer p {
  /* @editable */ color:{{brand.colors.ink}};
  font-family:{{brand.fonts.body}};
  font-size:12px;
  line-height:18px;
  padding:0 0 10px;
}

/* @group Footer / Links */
.footer a {
  /* @editable */ color:{{brand.colors.ink}};
  text-decoration:underline;
}
</style>
{{#logo?}}
<tr>
<td class="band-{{band|ink}}" align="{{align|center}}" style="padding:30px 30px 0;">
<img data-edit="footer_logo" data-label="Footer: logo" src="{{logo}}" width="120" alt="{{logo_alt}}" style="display:block; width:120px; max-width:120px; height:auto; border:0;">
</td>
</tr>
{{/logo}}
<tr>
<td class="footer band-{{band|ink}}" data-edit="footer" data-label="Legal footer" align="{{align|center}}" style="padding:30px 30px 20px;">
{{text}}
</td>
</tr>

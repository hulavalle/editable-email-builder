<!-- Empty space of a fixed height, in pixels. Use an `id` to place it more than once. -->
<style>
/* @group Spacer / Background */
.spacer {
  /* @editable */ background-color:{{brand.colors.white}};
}
</style>
<tr>
<td class="spacer" height="{{height}}" style="height:{{height}}px; font-size:0; line-height:0;">&nbsp;</td>
</tr>

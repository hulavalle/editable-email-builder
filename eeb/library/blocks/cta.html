<!-- Closing call to action: a question and a button. The person editing the campaign can hide it. -->
<style>
/* @group Call to action / Title */
.cta-text h2 {
  /* @editable */ color:{{brand.colors.ink}};
  /* @editable */ font-size:36px;
  font-family:{{brand.fonts.headings}};
  font-weight:400;
  line-height:48px;
  text-align:center;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .cta-text h2 { font-size:28px !important; line-height:38px !important; }
  .cta-button-table { width:100% !important; }
}
</style>
<tr>
<td class="cta band-{{band|white}}">
<table role="presentation" data-hide width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td class="cta-text" data-edit="cta_text" data-label="Call to action: title" align="center" style="padding:40px 10px 0;">
{{text}}
</td>
</tr>
<tr>
<td align="center" style="padding:20px 10px 50px;">
<table role="presentation" class="cta-button-table" width="470" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; width:470px;">
<tr>
<td class="button-primary" data-edit="cta_button" data-label="Call to action: button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>
</table>
</td>
</tr>

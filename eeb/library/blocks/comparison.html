<!-- A comparison table: one row per feature, two columns to compare, with ticks or short values.
     For product comparisons and plan upgrades. -->
<style>
/* @group Comparison / Background */
.comparison {
  /* @editable */ background-color:{{brand.colors.white}};
}

/* @group Comparison / Column headings */
.comparison-head {
  /* @editable */ background-color:{{brand.colors.primary}};
}

/* @group Comparison / Column heading text */
.comparison-head p {
  /* @editable */ color:{{brand.colors.white}};
  font-family:{{brand.fonts.body}};
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  line-height:20px;
  text-align:center;
  text-transform:uppercase;
}

/* @group Comparison / Cells */
.comparison-cell p {
  /* @editable */ color:{{brand.colors.ink}};
  font-family:{{brand.fonts.body}};
  font-size:15px;
  line-height:22px;
}
</style>
<tr>
<td class="comparison mobile-pad" style="padding:24px 40px 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td class="comparison-head" width="46%" style="padding:12px;">&nbsp;</td>
<td class="comparison-head" data-edit="comparison_head_a" data-label="Comparison: first column" width="27%" style="padding:12px;">
{{column_a}}
</td>
<td class="comparison-head" data-edit="comparison_head_b" data-label="Comparison: second column" width="27%" style="padding:12px;">
{{column_b}}
</td>
</tr>
{{#rows}}
<tr>
<td class="comparison-cell" data-edit="comparison_{{n}}_feature" data-label="Comparison row {{n}}: feature" style="padding:12px; border-bottom:1px solid {{brand.colors.line}};">
{{feature}}
</td>
<td class="comparison-cell" data-edit="comparison_{{n}}_a" data-label="Comparison row {{n}}: first column" align="center" style="padding:12px; border-bottom:1px solid {{brand.colors.line}};">
{{a}}
</td>
<td class="comparison-cell" data-edit="comparison_{{n}}_b" data-label="Comparison row {{n}}: second column" align="center" style="padding:12px; border-bottom:1px solid {{brand.colors.line}};">
{{b}}
</td>
</tr>
{{/rows}}
</table>
</td>
</tr>

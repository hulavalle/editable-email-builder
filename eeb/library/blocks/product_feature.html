<!-- One product, large: photo, name, price, a short description and a button. For launches,
     restocks and price drops. -->
<style>
/* @group Featured product / Name */
.product-feature-copy h2 {
  /* @editable */ color:{{brand.colors.ink}};
  /* @editable */ font-size:30px;
  font-family:{{brand.fonts.headings}};
  font-weight:400;
  line-height:38px;
  text-align:center;
}

/* @group Featured product / Price */
.product-feature-copy h3 {
  /* @editable */ color:{{brand.colors.primary}};
  font-family:{{brand.fonts.body}};
  font-size:20px;
  font-weight:700;
  line-height:28px;
  padding:6px 0 14px;
  text-align:center;
}

/* @group Featured product / Description */
.product-feature-copy p {
  /* @editable */ color:{{brand.colors.ink}};
  /* @editable */ font-size:16px;
  font-family:{{brand.fonts.body}};
  line-height:25px;
  text-align:center;
}
</style>
<tr>
<td class="product-feature band-{{band|white}} mobile-pad" align="center" style="padding:36px 40px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="font-size:0; line-height:0; padding:0 0 24px;">
<img data-edit="product_feature_photo" data-label="Featured product: photo" class="fluid" src="{{photo}}" width="400" alt="{{photo_alt}}" style="display:block; width:100%; max-width:400px; height:auto; border:0; border-radius:10px;">
</td>
</tr>
<tr>
<td class="product-feature-copy" data-edit="product_feature_copy" data-label="Featured product: text" align="center" style="padding:0 0 24px;">
{{text}}
</td>
</tr>
<tr>
<td align="center">
<table role="presentation" class="button-table" width="320" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; width:320px;">
<tr>
<td class="button-primary" data-edit="product_feature_button" data-label="Featured product: button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>
</table>
</td>
</tr>

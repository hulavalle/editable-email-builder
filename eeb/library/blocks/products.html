<!-- A row of product cards on a dark band, between two wave images. The person editing the campaign
     can repeat the row. The waves are fixed images painted with brand colors, so the band color is
     not editable: a changed color would no longer match them. -->
<style>
/* @group Products / Name */
.product-name p {
  /* @editable */ color:{{brand.colors.white}};
  /* @editable */ font-size:24px;
  font-family:{{brand.fonts.headings}};
  line-height:36px;
  text-align:center;
}

@media only screen and (max-width:{{brand.mobile}}px) {
  .product-column { display:block !important; width:100% !important; padding:0 0 35px !important; }
  .product-gap { display:none !important; }
  .product-photo { max-width:240px !important; margin:0 auto !important; }
  .product-button-table { width:240px !important; margin:0 auto !important; }
}
</style>
<tr>
<td style="font-size:0; line-height:0; background-color:{{brand.colors.sand}};">
<img class="fluid" src="{{wave_top}}" width="600" alt="" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
</td>
</tr>
<tr>
<td style="background-color:{{brand.colors.ink}};">
<table role="presentation" data-repeat="products" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="padding:35px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
{{#cards}}
<td class="product-gap" width="30" style="width:30px; font-size:0; line-height:0;">&nbsp;</td>
<td class="product-column" width="160" valign="top" style="width:160px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="font-size:0; line-height:0;">
<img data-edit="product_{{n}}_photo" data-label="Product {{n}}: photo" class="product-photo" src="{{photo}}" width="160" alt="{{photo_alt}}" style="display:block; width:100%; max-width:160px; height:auto; border:0; border-radius:8px;">
</td>
</tr>
<tr>
<td class="product-name" data-edit="product_{{n}}_name" data-label="Product {{n}}: name" align="center" style="padding:16px 0;">
{{name}}
</td>
</tr>
<tr>
<td align="center">
<table role="presentation" class="product-button-table" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;">
<tr>
<td class="button-light" data-edit="product_{{n}}_button" data-label="Product {{n}}: button" align="center">
{{button}}
</td>
</tr>
</table>
</td>
</tr>
</table>
</td>
{{/cards}}
<td class="product-gap" width="30" style="width:30px; font-size:0; line-height:0;">&nbsp;</td>
</tr>
</table>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="font-size:0; line-height:0; background-color:{{brand.colors.ink}};">
<img class="fluid" src="{{wave_bottom}}" width="600" alt="" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
</td>
</tr>
